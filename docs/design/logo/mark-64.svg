<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- the large drawing redrawn on a 64 grid (the pane's logo at 2x, the manifest's high resolution icon, the 64 px favicon and
       exe entry), never the 80 scaled by .8, which puts edges between pixels: pole and bar 4 px (at 2x that is the 2 CSS px
       the pane's navy band needs, AH-203), the blade 8 at its widest, the gold line 1 px set 2 px in, and the emblem as
       AH-121 drew it at 64, 3 px higher -->
  <g data-part="spear" fill="#997D3A">
    <path d="M32 3 L36 13 L34 18 H30 L28 13 Z"/>
    <rect x="30" y="18" width="4" height="14"/>
  </g>
  <rect data-part="bar" x="10" y="32" width="44" height="4" fill="#997D3A"/>
  <g data-part="banner">
    <path d="M16 36 H48 V58 L32 61 L16 58 Z" fill="#0C1938"/>
    <path d="M18.5 38.5 H45.5 V55.93 L32 58.46 L18.5 55.93 Z" fill="none" stroke="#997D3A" stroke-linejoin="miter"/>
  </g>
  <g data-part="emblem">
    <g fill="#F7F5F0"><path d="M24 49 H32 L29 54 H21 Z"/><path d="M40 49 H32 L35 54 H43 Z"/></g>
    <circle cx="32" cy="45.5" r="2.2" fill="none" stroke="#F7F5F0"/>
    <path d="M28.6 48.18 L35.4 42.82" fill="none" stroke="#F7F5F0" stroke-linecap="square"/>
  </g>
</svg>
