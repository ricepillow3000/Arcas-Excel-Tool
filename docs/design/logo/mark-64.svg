  <!-- the 64 px drawing (the pane's logo at 2x, the manifest's high resolution icon, the 64 px favicon and exe entry), on
       its own grid (AH-203 fix round 1): the bar, banner and gold line are whole pixels (crispEdges), so the hem's point
       is sharp, never a blend; the blade starts as a flat 2 px tip and meets the pole 4 px wide, both on whole pixels,
       its sides straight (in 1 px steps they read as a tiered tower at 2x), 8 px at its widest; the pole and bar 4 px
       (2 CSS px on the pane's navy band at 2x), the bar 3 px past the banner each side, the gold line 1 px set 2 px in;
       the emblem, AH-121's at 64, drawn smooth over it -->
